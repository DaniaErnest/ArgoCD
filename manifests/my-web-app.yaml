apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: my-web
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/DaniaErnest/ArgoCD.git
    targetRevision: HEAD
    path: manifests
  destination:
    server: https://kubernetes.default.svc
    namespace: my-web
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
    - CreateNamespace=true
